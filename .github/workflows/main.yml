name: Gaming News Checker
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write  
jobs:
  check-news:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install and Run
        run: |
          cd gaming-news-bot
          pip install -r requirements.txt
          DISCORD_WEBHOOK=${{ secrets.DISCORD_WEBHOOK_COD }} python check_news.py --game cod || true
          DISCORD_WEBHOOK=${{ secrets.DISCORD_WEBHOOK_GTA6 }} python check_news.py --game gta6 || true
          DISCORD_WEBHOOK=${{ secrets.DISCORD_WEBHOOK_BF6 }} python check_news.py --game bf6 || true
          DISCORD_WEBHOOK=${{ secrets.DISCORD_WEBHOOK_ARC }} python check_news.py --game arc_raiders || true
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update bot data [skip ci]"
          git push || true
