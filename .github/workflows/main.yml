name: Gaming News Bot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install feedparser requests
      
      - name: Check all games
        working-directory: gaming-news-bot
        run: |
          python check_news.py --game cod || echo "COD check failed"
          python check_news.py --game gta6 || echo "GTA6 check failed"
          python check_news.py --game bf6 || echo "BF6 check failed"
          python check_news.py --game arc_raiders || echo "Arc Raiders check failed"
        env:
          DISCORD_WEBHOOK_COD: ${{ secrets.DISCORD_WEBHOOK_COD }}
          DISCORD_WEBHOOK_GTA6: ${{ secrets.DISCORD_WEBHOOK_GTA6 }}
          DISCORD_WEBHOOK_BF6: ${{ secrets.DISCORD_WEBHOOK_BF6 }}
          DISCORD_WEBHOOK_ARC: ${{ secrets.DISCORD_WEBHOOK_ARC }}
