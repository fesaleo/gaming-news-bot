name: Gaming News Bot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install feedparser requests
      - run: python check_news.py --game cod || true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_COD }}
      - run: python check_news.py --game gta6 || true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_GTA6 }}
      - run: python check_news.py --game bf6 || true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_BF6 }}
      - run: python check_news.py --game arc_raiders || true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ARC }}
