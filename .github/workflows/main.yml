name: Gaming News Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install feedparser requests
      
      - name: Check COD News
        working-directory: gaming-news-bot
        env:
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1422280880193273888/DhWRDX8c8VnjJvNTquxxHQAOV7bH_kPnGY7W1I9tMzK7hiyJ05Fs_c7jpyX1YqOGtl_h
        run: python check_news.py --game cod
      
      - name: Check GTA6 News
        working-directory: gaming-news-bot
        env:
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1422281375314215004/sqjss5APnpZKdc-AbXDyQs53tHjPKCruczbgpjqRzvZ5q1fMV4frve55LkwzoB5oGxAA
        run: python check_news.py --game gta6
      
      - name: Check BF6 News
        working-directory: gaming-news-bot
        env:
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1422281076906266745/mFnv_Lpf21rxyveV4e0V2mdcj5oo3RXsOiNS-WdaMmLSwfRl6yHIn06ZaI7RhwTxeQrz
        run: python check_news.py --game bf6
      
      - name: Check Arc News
        working-directory: gaming-news-bot
        env:
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1422281219369865297/QjQkR7NtUhKoqyTQdLujF0Il0MK5-Je7RT_H8IL1KBuUtkBRn-d9jve3p3oC1t17_tLQ
        run: python check_news.py --game arc_raiders
